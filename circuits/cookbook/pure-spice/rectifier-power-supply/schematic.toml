version = 1

[schematic]
netlist = "rectifier-power-supply.cir"
output = "schematic.svg"
title = "Full-wave rectifier and Zener regulator"
description = "A grounded 12 volt RMS AC source drives a four-diode bridge. Its floating reservoir and dc_return rails feed a reservoir capacitor, series resistor, 9.1 volt Zener shunt, permanent load, and a switched parallel load."
subtitle = "12 V RMS, 50 Hz · floating DC return · 680 Ω load step at 150 ms"

