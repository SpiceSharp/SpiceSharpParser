  <title id="title">Full-wave rectifier and Zener regulator</title>
  <desc id="desc">A grounded 12 volt RMS AC source drives a four-diode bridge. Its floating reservoir and dc_return rails feed a reservoir capacitor, series resistor, 9.1 volt Zener shunt, permanent load, and a switched parallel load.</desc>
