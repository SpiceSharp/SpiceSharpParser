version = 1

[schematic]
netlist = "loaded-voltage-divider.cir"
output = "schematic.svg"
title = "Loaded voltage divider and emitter-follower buffer"
description = "Two identical 100 kilohm and 33 kilohm dividers drive 10 kilohm loads. The direct branch is compared with a 2N3904 emitter-follower branch under matching 100 microampere load steps."
subtitle = "Load error and output resistance, with and without a transistor buffer"

