version = 1

[schematic]
netlist = "astable-led-flasher.cir"
output = "schematic.svg"
title = "Two-transistor astable LED flasher"
description = "Two 2N3904 common-emitter stages have LED collector loads and are cross-coupled by 22 microfarad timing capacitors. The symmetric positive-feedback loop alternately lights the two LEDs from a 5 volt supply."
subtitle = "A free-running, cross-coupled transistor beacon"

