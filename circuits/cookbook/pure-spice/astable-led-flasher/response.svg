<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Verified two-transistor astable LED-flasher response</title>
  <desc id="desc">The two collectors alternate between 0.0464 and 3.4785 volts with a 0.52855 second period, producing opposite-phase LED current pulses at 1.892 hertz and 9.112 milliamps peak.</desc>
  <style>
    .axis{stroke:#46546a;stroke-width:2}.grid{stroke:#dde4ed;stroke-width:1}.q1{fill:none;stroke:#1976d2;stroke-width:3}.q2{fill:none;stroke:#c23b52;stroke-width:3}.i1{fill:none;stroke:#2b8a5a;stroke-width:3}.i2{fill:none;stroke:#d58a20;stroke-width:3}.text{fill:#253248;font:14px 'Segoe UI',sans-serif}.small{fill:#5b687b;font:12px 'Segoe UI',sans-serif}.heading{fill:#182235;font:600 21px 'Segoe UI',sans-serif}.panel{fill:#f8fafc;stroke:#d7dee8}.period{stroke:#8190a3;stroke-width:1.4;stroke-dasharray:5 5}
  </style>
  <rect width="960" height="520" fill="#fff"/>
  <text x="44" y="32" class="heading">Verified free-running astable response</text>
  <text x="44" y="54" class="small">Collector voltages and LED currents alternate in opposite phase after deterministic startup.</text>
  <rect x="76" y="84" width="814" height="190" class="panel"/>
  <line x1="76" y1="274" x2="890" y2="274" class="axis"/><line x1="76" y1="84" x2="76" y2="274" class="axis"/>
  <line x1="76" y1="122" x2="890" y2="122" class="grid"/><text x="29" y="278" class="small">0 V</text><text x="29" y="126" class="small">4 V</text>
  <path class="q1" d="M76 109 L174 109 L180 272 L278 272 L284 109 L382 109 L388 272 L486 272 L492 109 L590 109 L596 272 L694 272 L700 109 L798 109 L804 272 L890 272"/>
  <path class="q2" d="M76 272 L174 272 L180 109 L278 109 L284 272 L382 272 L388 109 L486 109 L492 272 L590 272 L596 109 L694 109 L700 272 L798 272 L804 109 L890 109"/>
  <line x1="110" y1="101" x2="147" y2="101" class="q1"/><text x="156" y="106" class="small">Q1 collector</text>
  <line x1="272" y1="101" x2="309" y2="101" class="q2"/><text x="318" y="106" class="small">Q2 collector</text>
  <text x="702" y="102" class="small">3.4785 V high</text><text x="702" y="264" class="small">0.04644 V low</text>
  <rect x="76" y="304" width="814" height="120" class="panel"/>
  <line x1="76" y1="424" x2="890" y2="424" class="axis"/><line x1="76" y1="304" x2="76" y2="424" class="axis"/>
  <text x="16" y="428" class="small">0 mA</text><text x="10" y="316" class="small">10 mA</text>
  <path class="i1" d="M76 424 L174 424 L180 314 L278 314 L284 424 L382 424 L388 314 L486 314 L492 424 L590 424 L596 314 L694 314 L700 424 L798 424 L804 314 L890 314"/>
  <path class="i2" d="M76 314 L174 314 L180 424 L278 424 L284 314 L382 314 L388 424 L486 424 L492 314 L590 314 L596 424 L694 424 L700 314 L798 314 L804 424 L890 424"/>
  <line x1="110" y1="326" x2="147" y2="326" class="i1"/><text x="156" y="331" class="small">LED1 current</text>
  <line x1="272" y1="326" x2="309" y2="326" class="i2"/><text x="318" y="331" class="small">LED2 current</text><text x="712" y="326" class="small">9.112 mA peak</text>
  <line x1="180" y1="76" x2="180" y2="424" class="period"/><line x1="388" y1="76" x2="388" y2="424" class="period"/>
  <path d="M180 72 L388 72 M180 68 L180 76 M388 68 L388 76" class="period"/><text x="223" y="67" class="small">T = 0.52855 s; f = 1.8920 Hz</text>
  <text x="65" y="446" class="small">2.0 s</text><text x="272" y="446" class="small">2.53 s</text><text x="478" y="446" class="small">3.06 s</text><text x="684" y="446" class="small">3.59 s</text><text x="855" y="446" class="small">4.1 s</text>
  <rect x="76" y="470" width="814" height="30" rx="6" fill="#f3f7fb"/>
  <text x="221" y="490" class="text">LED1 average current 4.7487 mA; most-negative base voltage −2.7008 V.</text>
</svg>
