  <title id="title">Two-transistor astable LED flasher</title>
  <desc id="desc">Two 2N3904 common-emitter stages have LED collector loads and are cross-coupled by 22 microfarad timing capacitors. The symmetric positive-feedback loop alternately lights the two LEDs from a 5 volt supply.</desc>
