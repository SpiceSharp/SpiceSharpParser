<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">RC sensor filter and input protector response</title>
  <desc id="desc">Summary of the measured 1.575 kilohertz low-pass corner and the positive and negative rail clamp levels and currents.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <style>.t{font:700 25px Segoe UI,Arial,sans-serif;fill:#10233f}.s{font:15px Segoe UI,Arial,sans-serif;fill:#53657d}.h{font:700 17px Segoe UI,Arial,sans-serif;fill:#10233f}.v{font:700 22px Segoe UI,Arial,sans-serif;fill:#1565c0}.a{fill:none;stroke:#1565c0;stroke-width:4}.b{fill:none;stroke:#e26d3d;stroke-width:4}.g{stroke:#ccd6e3;stroke-width:1}.p{fill:#fff;stroke:#d5deea;stroke-width:2}</style>
  <text class="t" x="42" y="48">RC filter and clamp — verified response</text>
  <text class="s" x="42" y="76">10 kΩ / 10 nF filter, 1 MΩ ADC load, 3.3 V clamp rail</text>
  <rect class="p" x="42" y="105" width="420" height="340" rx="14"/>
  <text class="h" x="66" y="137">AC magnitude</text>
  <line class="g" x1="82" y1="390" x2="430" y2="390"/><line class="g" x1="82" y1="170" x2="82" y2="390"/>
  <path class="a" d="M82 180 C190 181 248 190 300 240 C350 292 382 345 430 376"/>
  <line x1="300" y1="170" x2="300" y2="390" stroke="#7b8da5" stroke-dasharray="6 5"/>
  <text class="v" x="192" y="225">f₀.₇₀₇ = 1.575 kHz</text>
  <text class="s" x="76" y="415">10 Hz</text><text class="s" x="280" y="415">1.6 kHz</text><text class="s" x="393" y="415">1 MHz</text>
  <rect class="p" x="490" y="105" width="428" height="154" rx="14"/>
  <text class="h" x="516" y="139">Positive fault</text><text class="v" x="516" y="183">+3.810 V</text>
  <text class="s" x="516" y="211">upper clamp current 115.1 µA</text><path class="b" d="M742 221 L742 185 L888 185"/>
  <rect class="p" x="490" y="281" width="428" height="164" rx="14"/>
  <text class="h" x="516" y="315">Negative fault</text><text class="v" x="516" y="360">−0.522 V</text>
  <text class="s" x="516" y="389">lower clamp current 147.3 µA</text><path class="b" d="M742 347 L742 389 L888 389"/>
</svg>
