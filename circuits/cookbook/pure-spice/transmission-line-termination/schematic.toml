version = 1

[schematic]
netlist = "transmission-line-termination.cir"
output = "schematic.svg"
title = "Transmission-line termination comparison"
description = "Two identical five volt pulse drivers feed fifty ohm, twenty nanosecond lossless lines; one cable is nearly open and rings, while the other has a matched fifty ohm load."
subtitle = "The same cable with an open load and a matched load"

[[elements]]
id = "VOPEN"
start = [0, 5]
end = [0, 0]
value = "5 V pulse"

[[elements]]
id = "RSOPEN"
start = [0, 5]
end = [3, 5]

[[elements]]
id = "TOPEN"
kind = "block"
start = [3, 5]
end = [7, 5]
terminals = ["open_in", "open_out"]
label = "TOPEN"
value = "50 Ω / 20 ns"

[[elements]]
id = "RLOPEN"
start = [9, 5]
end = [9, 0]
label = ""
value = ""

[[elements]]
id = "VMATCH"
start = [12, 5]
end = [12, 0]
value = "5 V pulse"

[[elements]]
id = "RSMATCH"
start = [12, 5]
end = [15, 5]

[[elements]]
id = "TMATCH"
kind = "block"
start = [15, 5]
end = [19, 5]
terminals = ["match_in", "match_out"]
label = "TMATCH"
value = "50 Ω / 20 ns"

[[elements]]
