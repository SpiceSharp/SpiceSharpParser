version = 1

[schematic]
netlist = "diode-envelope-detector.cir"
output = "schematic.svg"
title = "Diode peak detector and AM envelope follower"
description = "A 20 kilohertz amplitude-modulated source drives a silicon diode that charges a 100 nanofarad capacitor. A 10 kilohm load releases the stored voltage to follow the 100 hertz envelope."
subtitle = "One-diode detection with an RC attack, release, and ripple tradeoff"

