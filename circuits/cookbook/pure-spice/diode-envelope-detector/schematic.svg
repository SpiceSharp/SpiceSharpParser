  <title id="title">Diode peak detector and AM envelope follower</title>
  <desc id="desc">A 20 kilohertz amplitude-modulated source drives a silicon diode that charges a 100 nanofarad capacitor. A 10 kilohm load releases the stored voltage to follow the 100 hertz envelope.</desc>
