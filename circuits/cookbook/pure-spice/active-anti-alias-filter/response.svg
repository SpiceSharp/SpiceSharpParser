<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Active anti-alias filter response</title>
  <desc id="desc">The two-pole filter has near-unity low-frequency gain, a 1.221 kilohertz minus-three-decibel frequency, 0.0355 gain at 10 kilohertz, and 0.3265 millisecond step settling.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <style>.t{font:700 25px Segoe UI,Arial,sans-serif;fill:#10233f}.s{font:15px Segoe UI,Arial,sans-serif;fill:#53657d}.h{font:700 17px Segoe UI,Arial,sans-serif;fill:#10233f}.v{font:700 22px Segoe UI,Arial,sans-serif;fill:#1565c0}.p{fill:#fff;stroke:#d5deea;stroke-width:2}.a{fill:none;stroke:#1565c0;stroke-width:4}.b{fill:none;stroke:#e26d3d;stroke-width:4}.g{stroke:#ccd6e3}</style>
  <text class="t" x="42" y="48">Active anti-alias filter — verified response</text>
  <text class="s" x="42" y="76">Two buffered RC poles plus an isolated ADC load</text>
  <rect class="p" x="42" y="105" width="580" height="340" rx="14"/>
  <text class="h" x="68" y="138">AC gain</text><line class="g" x1="82" y1="390" x2="592" y2="390"/><line class="g" x1="82" y1="170" x2="82" y2="390"/>
  <path class="a" d="M82 178 C200 180 265 194 324 238 C386 286 450 345 592 382"/>
  <path class="b" d="M82 180 C230 181 315 192 388 240 C455 287 510 335 592 370"/>
  <line x1="324" y1="170" x2="324" y2="390" stroke="#7b8da5" stroke-dasharray="6 5"/>
  <text class="v" x="194" y="230">−3 dB at 1.221 kHz</text><text class="s" x="96" y="201" fill="#e26d3d">pole 1</text><text class="s" x="96" y="226" fill="#1565c0">ADC output</text>
  <text class="s" x="76" y="416">10 Hz</text><text class="s" x="306" y="416">1.2 kHz</text><text class="s" x="548" y="416">10 MHz</text>
  <rect class="p" x="650" y="105" width="268" height="100" rx="14"/><text class="h" x="674" y="137">Gain at 10 kHz</text><text class="v" x="674" y="176">0.03551 V/V</text>
  <rect class="p" x="650" y="225" width="268" height="100" rx="14"/><text class="h" x="674" y="257">Settled output</text><text class="v" x="674" y="296">0.99953 V</text>
  <rect class="p" x="650" y="345" width="268" height="100" rx="14"/><text class="h" x="674" y="377">90% settling</text><text class="v" x="674" y="416">0.3265 ms</text>
</svg>
