version = 1

[schematic]
netlist = "active-anti-alias-filter.cir"
output = "schematic.svg"
title = "Active anti-alias filter and ADC buffer"
description = "Two buffered resistor-capacitor low-pass stages attenuate high-frequency sensor content, followed by a low-resistance output that drives an ADC input capacitance and load."
subtitle = "Buffered two-pole filtering with a realistic converter input"

