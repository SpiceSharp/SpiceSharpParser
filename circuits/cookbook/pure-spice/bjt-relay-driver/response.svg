<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">BJT relay driver switching response</title>
  <desc id="desc">The coil reaches 98 milliamps while on, the collector stays near 0.089 volts, and the flyback diode limits the collector peak to 12.759 volts at turn-off.</desc>
  <rect width="960" height="520" fill="#f8fafc"/>
  <style>.t{font:700 25px Segoe UI,Arial,sans-serif;fill:#10233f}.s{font:15px Segoe UI,Arial,sans-serif;fill:#53657d}.h{font:700 17px Segoe UI,Arial,sans-serif;fill:#10233f}.v{font:700 22px Segoe UI,Arial,sans-serif;fill:#1565c0}.p{fill:#fff;stroke:#d5deea;stroke-width:2}.i{fill:none;stroke:#1565c0;stroke-width:4}.c{fill:none;stroke:#e26d3d;stroke-width:4}.g{stroke:#ccd6e3}</style>
  <text class="t" x="42" y="48">Relay driver — verified turn-on and flyback</text>
  <text class="s" x="42" y="76">12 V, 120 Ω / 100 mH coil, 5 V logic drive</text>
  <rect class="p" x="42" y="105" width="580" height="340" rx="14"/>
  <text class="h" x="68" y="138">Switching waveforms</text>
  <line class="g" x1="82" y1="390" x2="592" y2="390"/><line class="g" x1="82" y1="170" x2="82" y2="390"/>
  <path class="i" d="M82 388 L132 388 C165 360 188 300 224 230 C272 180 360 178 405 178 C438 181 468 246 510 330 C535 365 560 382 592 387"/>
  <path class="c" d="M82 205 L132 205 L134 380 L404 380 L406 160 L422 135 L430 205 L592 205"/>
  <text class="s" x="92" y="417">0 ms</text><text class="s" x="382" y="417">turn-off</text><text class="s" x="548" y="417">11 ms</text>
  <text class="s" x="102" y="188" fill="#1565c0">coil current</text><text class="s" x="458" y="153" fill="#e26d3d">collector voltage</text>
  <rect class="p" x="650" y="105" width="268" height="100" rx="14"/><text class="h" x="674" y="137">On state</text><text class="v" x="674" y="176">98.01 mA</text>
  <rect class="p" x="650" y="225" width="268" height="100" rx="14"/><text class="h" x="674" y="257">Collector clamp</text><text class="v" x="674" y="296">12.759 V</text>
  <rect class="p" x="650" y="345" width="268" height="100" rx="14"/><text class="h" x="674" y="377">36.8 mA decay</text><text class="v" x="674" y="416">0.748 ms</text>
</svg>
