version = 1

[schematic]
netlist = "bjt-relay-driver.cir"
output = "schematic.svg"
title = "BJT relay driver with flyback diode"
description = "A five volt control signal drives an NPN transistor that switches a twelve volt relay coil, with a diode returning inductive current safely to the supply when the transistor turns off."
subtitle = "Low-side inductive-load switching with controlled turn-off"

