<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Two-pole buffered PWM digital-to-analog converter</title>
  <desc id="desc">A PWM source drives an RC low-pass pole, a unity buffer, a second RC pole, an output buffer, and a load.</desc>
  <style>
    .wire { fill: none; stroke: #243247; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .part { fill: #ffffff; stroke: #243247; stroke-width: 2.5; }
    .node { fill: #243247; }
    .label { fill: #172235; font: 15px 'Segoe UI', sans-serif; }
    .small { fill: #57667a; font: 13px 'Segoe UI', sans-serif; }
    .heading { fill: #172235; font: 600 22px 'Segoe UI', sans-serif; }
    .signal { fill: none; stroke: #1976d2; stroke-width: 3; }
    .analog { fill: none; stroke: #c23b52; stroke-width: 3; }
    .buffer { fill: #f4f8fd; stroke: #526d91; stroke-width: 2.5; }
  </style>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="36" y="38" class="heading">PWM digital-to-analog converter</text>
  <text x="36" y="62" class="small">Two isolated 1 kohm / 1 uF poles; node names match pwm-dac.cir</text>

  <rect x="42" y="112" width="118" height="108" rx="8" class="part"/>
  <path d="M58 178 L58 145 L77 145 L77 178 L96 178 L96 145 L115 145 L115 178 L134 178 L134 145 L150 145" class="signal"/>
  <text x="63" y="201" class="label">VPWM</text>
  <text x="55" y="239" class="small">0 to 5 V</text>
  <text x="51" y="258" class="small">20 kHz, 40%</text>

  <line x1="160" y1="166" x2="202" y2="166" class="signal"/>
  <polyline points="202,166 214,154 226,178 238,154 250,178 262,154 274,166" class="wire"/>
  <text x="214" y="137" class="label">R1 1k</text>
  <line x1="274" y1="166" x2="324" y2="166" class="wire"/>
  <circle cx="306" cy="166" r="5" class="node"/>
  <text x="282" y="143" class="small">pole1</text>

  <line x1="306" y1="166" x2="306" y2="235" class="wire"/>
  <line x1="286" y1="235" x2="326" y2="235" class="wire"/>
  <line x1="286" y1="248" x2="326" y2="248" class="wire"/>
  <line x1="306" y1="248" x2="306" y2="326" class="wire"/>
  <text x="276" y="276" class="label">C1 1u</text>

  <polygon points="350,121 350,211 436,166" class="buffer"/>
  <text x="363" y="160" class="label">E1</text>
  <text x="359" y="180" class="small">gain 1</text>
  <line x1="324" y1="166" x2="350" y2="166" class="wire"/>
  <line x1="436" y1="166" x2="475" y2="166" class="wire"/>
  <text x="404" y="118" class="small">buffer1</text>

  <polyline points="475,166 487,154 499,178 511,154 523,178 535,154 547,166" class="wire"/>
  <text x="487" y="137" class="label">R2 1k</text>
  <line x1="547" y1="166" x2="598" y2="166" class="wire"/>
  <circle cx="579" cy="166" r="5" class="node"/>
  <text x="555" y="143" class="small">pole2</text>

  <line x1="579" y1="166" x2="579" y2="235" class="wire"/>
  <line x1="559" y1="235" x2="599" y2="235" class="wire"/>
  <line x1="559" y1="248" x2="599" y2="248" class="wire"/>
  <line x1="579" y1="248" x2="579" y2="326" class="wire"/>
  <text x="549" y="276" class="label">C2 1u</text>

  <polygon points="625,121 625,211 711,166" class="buffer"/>
  <text x="638" y="160" class="label">E2</text>
  <text x="634" y="180" class="small">gain 1</text>
  <line x1="598" y1="166" x2="625" y2="166" class="wire"/>
  <line x1="711" y1="166" x2="772" y2="166" class="analog"/>
  <circle cx="772" cy="166" r="5" class="node"/>
  <text x="744" y="143" class="small">output</text>

  <line x1="772" y1="166" x2="772" y2="202" class="wire"/>
  <polyline points="772,202 760,214 784,226 760,238 784,250 760,262 772,274" class="wire"/>
  <line x1="772" y1="274" x2="772" y2="326" class="wire"/>
  <text x="795" y="233" class="label">RLOAD</text>
  <text x="795" y="253" class="small">10 kohm</text>

  <line x1="111" y1="326" x2="840" y2="326" class="wire"/>
  <line x1="111" y1="220" x2="111" y2="326" class="wire"/>
  <circle cx="306" cy="326" r="5" class="node"/>
  <circle cx="579" cy="326" r="5" class="node"/>
  <circle cx="772" cy="326" r="5" class="node"/>
  <line x1="824" y1="326" x2="824" y2="340" class="wire"/>
  <line x1="806" y1="340" x2="842" y2="340" class="wire"/>
  <line x1="812" y1="348" x2="836" y2="348" class="wire"/>
  <line x1="818" y1="356" x2="830" y2="356" class="wire"/>

  <rect x="52" y="377" width="856" height="28" rx="6" fill="#f5f8fc"/>
  <text x="68" y="396" class="small">R1/C1 remove most carrier energy; E1 prevents loading; R2/C2 suppress the remaining ripple; E2 drives the load.</text>
</svg>
