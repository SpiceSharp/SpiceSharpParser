version = 1

[schematic]
netlist = "ideal-diode-power-or.cir"
output = "schematic.svg"
title = "Ideal-diode redundant power input"
description = "A 12 volt primary supply and an 11.5 volt backup supply feed a common output through separate series resistances and ideal diodes. Both diode cathodes join at output, where a hold-up capacitor and 12 ohm load return to node zero."
subtitle = "50 mΩ ideal diodes · primary fails 4–8 ms · automatic backup takeover"

[theme]
font_size = 12
unit = 2.2
line_width = 2.2
signal_color = "#1976d2"
accent_color = "#c23b52"

[[elements]]
id = "VPRIMARY"
kind = "source-pulse"
start = [2.5, 7]
end = [0, 7]
value = "12 V · off 4–8 ms"
color = "#1976d2"

[[elements]]
id = "RPRIMARY"
start = [5, 7]
end = [8, 7]
value = "100 mΩ"
color = "#1976d2"

[[elements]]
