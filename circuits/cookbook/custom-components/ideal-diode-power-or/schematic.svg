<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Ideal-diode redundant power input</title>
  <desc id="desc">A 12 volt primary and 11.5 volt backup feed a common output through separate ideal diodes. A capacitor and 12 ohm load connect from the output to the common ground.</desc>
  <style>
    .wire { fill: none; stroke: #243247; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .primary { fill: none; stroke: #1976d2; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .backup { fill: none; stroke: #27845a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .output { fill: none; stroke: #c23b52; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .part { fill: #ffffff; stroke: #243247; stroke-width: 2.5; }
    .source { fill: #f5f8fc; stroke: #8ca0ba; stroke-width: 2; }
    .node { fill: #243247; }
    .label { fill: #172235; font: 15px 'Segoe UI', sans-serif; }
    .small { fill: #57667a; font: 13px 'Segoe UI', sans-serif; }
    .tiny { fill: #57667a; font: 12px 'Segoe UI', sans-serif; }
    .heading { fill: #172235; font: 600 22px 'Segoe UI', sans-serif; }
  </style>

  <rect width="960" height="500" fill="#ffffff"/>
  <text x="36" y="38" class="heading">Ideal-diode redundant power input</text>
  <text x="36" y="62" class="small">Both diode cathodes meet at output; both source returns, COUT, and RLOAD meet at node 0</text>

  <!-- Primary source and source resistance. -->
  <rect x="40" y="95" width="170" height="94" rx="9" class="source"/>
  <text x="69" y="122" class="label">VPRIMARY</text>
  <text x="76" y="146" class="small">12.0 V primary</text>
  <text x="58" y="168" class="tiny">fails 4 ms · returns 8 ms</text>
  <line x1="210" y1="140" x2="245" y2="140" class="primary"/>
  <text x="210" y="124" class="small">primary_raw</text>
  <polyline points="245,140 257,128 269,152 281,128 293,152 305,128 317,140" class="wire"/>
  <text x="247" y="86" class="label">RPRIMARY</text>
  <text x="265" y="105" class="small">100 mohm</text>
  <line x1="317" y1="140" x2="372" y2="140" class="primary"/>
  <circle cx="350" cy="140" r="5" class="node"/>
  <text x="323" y="172" class="small">primary_input</text>

  <!-- Primary ideal diode, anode left and cathode right. -->
  <line x1="372" y1="140" x2="385" y2="140" class="wire"/>
  <polygon points="385,123 415,140 385,157" class="part"/>
  <line x1="420" y1="121" x2="420" y2="159" class="wire"/>
  <line x1="420" y1="140" x2="520" y2="140" class="primary"/>
  <text x="370" y="103" class="label">DPRIMARY</text>
  <text x="382" y="181" class="tiny">anode → cathode</text>

  <!-- Backup source and source resistance. -->
  <rect x="40" y="245" width="170" height="94" rx="9" class="source"/>
  <text x="74" y="272" class="label">VBACKUP</text>
  <text x="72" y="296" class="small">11.5 V backup</text>
  <text x="69" y="318" class="tiny">always available</text>
  <line x1="210" y1="290" x2="245" y2="290" class="backup"/>
  <text x="210" y="274" class="small">backup_raw</text>
  <polyline points="245,290 257,278 269,302 281,278 293,302 305,278 317,290" class="wire"/>
  <text x="252" y="236" class="label">RBACKUP</text>
  <text x="265" y="255" class="small">150 mohm</text>
  <line x1="317" y1="290" x2="372" y2="290" class="backup"/>
  <circle cx="350" cy="290" r="5" class="node"/>
  <text x="324" y="322" class="small">backup_input</text>

  <!-- Backup ideal diode, anode left and cathode right. -->
  <line x1="372" y1="290" x2="385" y2="290" class="wire"/>
  <polygon points="385,273 415,290 385,307" class="part"/>
  <line x1="420" y1="271" x2="420" y2="309" class="wire"/>
  <line x1="420" y1="290" x2="520" y2="290" class="backup"/>
  <text x="374" y="253" class="label">DBACKUP</text>
  <text x="382" y="331" class="tiny">anode → cathode</text>

  <!-- The cathodes join here and feed one continuous output bus. -->
  <line x1="520" y1="140" x2="520" y2="290" class="output"/>
  <line x1="520" y1="215" x2="850" y2="215" class="output"/>
  <circle cx="520" cy="215" r="6" class="node"/>
  <circle cx="650" cy="215" r="5" class="node"/>
  <circle cx="790" cy="215" r="5" class="node"/>
  <text x="533" y="199" class="label">output</text>

  <!-- Output hold-up capacitor. -->
  <line x1="650" y1="215" x2="650" y2="280" class="wire"/>
  <line x1="628" y1="280" x2="672" y2="280" class="wire"/>
  <line x1="628" y1="294" x2="672" y2="294" class="wire"/>
  <line x1="650" y1="294" x2="650" y2="390" class="wire"/>
  <circle cx="650" cy="390" r="5" class="node"/>
  <text x="609" y="321" class="label">COUT</text>
  <text x="604" y="341" class="small">100 uF</text>

  <!-- Load resistor. -->
  <line x1="790" y1="215" x2="790" y2="250" class="wire"/>
  <polyline points="790,250 778,262 802,274 778,286 802,298 778,310 790,322" class="wire"/>
  <line x1="790" y1="322" x2="790" y2="390" class="wire"/>
  <circle cx="790" cy="390" r="5" class="node"/>
  <text x="812" y="280" class="label">RLOAD</text>
  <text x="812" y="301" class="small">12 ohm</text>

  <!-- Common node 0. -->
  <path d="M85 189 H25 V390" class="wire"/>
  <line x1="85" y1="339" x2="85" y2="390" class="wire"/>
  <line x1="25" y1="390" x2="850" y2="390" class="wire"/>
  <circle cx="25" cy="390" r="5" class="node"/>
  <circle cx="85" cy="390" r="5" class="node"/>
  <line x1="850" y1="390" x2="850" y2="405" class="wire"/>
  <line x1="832" y1="405" x2="868" y2="405" class="wire"/>
  <line x1="838" y1="413" x2="862" y2="413" class="wire"/>
  <line x1="844" y1="421" x2="856" y2="421" class="wire"/>
  <text x="866" y="397" class="small">0</text>

  <!-- Model and state legend. -->
  <rect x="36" y="447" width="888" height="34" rx="7" fill="#f5f8fc"/>
  <line x1="55" y1="464" x2="91" y2="464" class="primary"/>
  <text x="101" y="469" class="small">primary active: 0–4 ms and 8–12 ms</text>
  <line x1="355" y1="464" x2="391" y2="464" class="backup"/>
  <text x="401" y="469" class="small">backup active: 4–8 ms</text>
  <text x="635" y="469" class="small">IDEAL_OR: 50 mohm, 10 mV, 1 Gohm off</text>
</svg>
