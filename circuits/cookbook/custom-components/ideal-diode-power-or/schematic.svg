  <title id="title">Ideal-diode redundant power input</title>
  <desc id="desc">A 12 volt primary supply and an 11.5 volt backup supply feed a common output through separate series resistances and ideal diodes. Both diode cathodes join at output, where a hold-up capacitor and 12 ohm load return to node zero.</desc>
