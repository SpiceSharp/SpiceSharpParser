<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" height="422.8400000000001pt" width="1094.183pt" viewBox="-107.99799999999998 -386.20000000000005 1094.183 422.8400000000001" style="background-color:#ffffff;" role="img" aria-labelledby="title desc" data-generator="spicesharp-cookbook-schematic 0.1.0">
  <title id="title">Simple charge-pump phase-locked loop</title>
  <desc id="desc">A 1.5 kilohertz square-wave reference enters a phase detector whose charge-pump output drives a capacitor and leak resistor. The resulting control voltage tunes a one-to-two kilohertz VCO. A zero-crossing behavioral source converts the VCO sine wave into feedback edges and closes the loop.</desc>
