    L204 365 L204 331 L236 331 L236 365 L268 365 L268 331 L300 331 L300 365
    L332 365 L332 331 L364 331 L364 365 L396 365 L396 331 L428 331 L428 365
    L460 365 L460 331 L492 331 L492 365 L524 365 L524 331 L556 331 L556 365
    L588 365 L588 331 L620 331 L620 365 L652 365 L652 331 L684 331 L684 365
