  <text x="76" y="462" class="small">0 ms</text>
  <text x="266" y="462" class="small">20 ms</text>
  <text x="470" y="462" class="small">40 ms</text>
  <text x="674" y="462" class="small">60 ms</text>
  <text x="861" y="462" class="small">80 ms</text>
  <text x="292" y="486" class="text">Feedback begins slower, then converges on the 666.667 us reference period.</text>

  <rect x="621" y="290" width="271" height="19" rx="5" fill="#f4f0fb"/>
  <text x="636" y="304" class="small">Measured VCO cycle: 677.269 us</text>
