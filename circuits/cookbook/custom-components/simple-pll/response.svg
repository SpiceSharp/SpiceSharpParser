<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Verified PLL acquisition and lock summary</title>
  <desc id="desc">The control voltage rises from 0.1 volts toward 0.5 volts. Reference and feedback edge rates converge. In the settled interval, control averages 0.4944 volts and the measured VCO period is 677.269 microseconds.</desc>
  <style>
    .axis { stroke: #46546a; stroke-width: 2; }
    .grid { stroke: #dde4ed; stroke-width: 1; }
    .control { fill: none; stroke: #b74459; stroke-width: 3; }
    .reference { fill: none; stroke: #1976d2; stroke-width: 2.5; stroke-linejoin: round; }
    .feedback { fill: none; stroke: #7357a2; stroke-width: 2.5; stroke-linejoin: round; }
    .target { fill: none; stroke: #8190a3; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .text { fill: #253248; font: 14px 'Segoe UI', sans-serif; }
    .small { fill: #5b687b; font: 12px 'Segoe UI', sans-serif; }
    .heading { fill: #182235; font: 600 21px 'Segoe UI', sans-serif; }
    .panel { fill: #f8fafc; stroke: #d7dee8; stroke-width: 1; }
  </style>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="44" y="32" class="heading">Verified PLL acquisition and lock</text>
  <text x="44" y="53" class="small">Curves summarize the simulated behavior; annotations are netlist-native .MEAS results.</text>

  <rect x="76" y="76" width="816" height="206" class="panel"/>
