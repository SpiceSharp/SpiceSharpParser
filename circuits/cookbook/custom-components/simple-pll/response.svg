  <text x="699" y="121" class="small">average 0.4944 V</text>
  <text x="699" y="142" class="small">ripple 40.60 mV p-p</text>

  <rect x="76" y="316" width="816" height="125" class="panel"/>
  <text x="17" y="350" class="small">reference</text>
  <text x="17" y="410" class="small">feedback</text>
