  <line x1="280" y1="76" x2="280" y2="282" class="grid"/>
  <line x1="484" y1="76" x2="484" y2="282" class="grid"/>
  <line x1="688" y1="76" x2="688" y2="282" class="grid"/>
  <text x="32" y="286" class="small">0 V</text>
  <text x="25" y="183" class="small">0.5 V</text>
  <text x="25" y="81" class="small">1.0 V</text>
  <text x="800" y="171" class="small">0.5 V lock target</text>
  <text x="19" y="122" class="text">control</text>

  <path class="control" d="M76 261
    C112 257 148 243 181 225
