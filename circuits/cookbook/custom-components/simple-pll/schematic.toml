version = 1

[schematic]
netlist = "simple-pll.cir"
output = "schematic.svg"
title = "Simple charge-pump phase-locked loop"
description = "A 1.5 kilohertz square-wave reference enters a phase detector whose charge-pump output drives a capacitor and leak resistor. The resulting control voltage tunes a one-to-two kilohertz VCO. A zero-crossing behavioral source converts the VCO sine wave into feedback edges and closes the loop."
subtitle = "PHASEDET + 4.7 µF loop filter + 1–2 kHz MODULATOR VCO"

[theme]
font_size = 11
unit = 2.1
line_width = 2.1
signal_color = "#1976d2"
accent_color = "#c23b52"
block_fill = "#f4f0fb"

